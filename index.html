<div id="golf-league-app">
<style>
#golf-league-app {
  --gl-green-deep: #1a3a2a;
  --gl-green-mid: #2d5a3d;
  --gl-green-light: #4a8c5c;
  --gl-green-pale: #e8f2eb;
  --gl-gold: #c9a84c;
  --gl-gold-pale: #fdf7e6;
  --gl-cream: #faf8f3;
  --gl-white: #ffffff;
  --gl-text-dark: #1a2420;
  --gl-text-mid: #3d5045;
  --gl-text-light: #7a9080;
  --gl-border: rgba(26,58,42,0.12);
  --gl-border-strong: rgba(26,58,42,0.22);
  --gl-radius: 12px;
  --gl-radius-lg: 18px;
  font-family: 'DM Sans', sans-serif;
  color: var(--gl-text-dark);
  font-size: 18px;
  line-height: 1.75;
}
#golf-league-app * { box-sizing: border-box; margin: 0; padding: 0; }

.gl-header { background: var(--gl-green-deep); padding: 40px 40px 36px; border-radius: var(--gl-radius-lg) var(--gl-radius-lg) 0 0; position: relative; overflow: hidden; text-align: center; }
.gl-header::before { content:''; position:absolute; top:-40px; right:-40px; width:240px; height:240px; border-radius:50%; background:rgba(201,168,76,0.08); }
.gl-eyebrow { font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--gl-gold); font-weight:500; margin-bottom:12px; position:relative; }
.gl-title { font-family:'Playfair Display',serif; font-size:32px; font-weight:600; color:#fff; line-height:1.2; margin-bottom:10px; position:relative; }
.gl-subtitle { font-size:16px; color:rgba(255,255,255,0.45); font-weight:300; position:relative; letter-spacing:0.02em; }

.gl-body { background:var(--gl-cream); padding:36px 32px 56px; border-radius:0 0 var(--gl-radius-lg) var(--gl-radius-lg); border:1px solid var(--gl-border); border-top:none; }

.gl-tabs { display:flex; gap:4px; background:var(--gl-white); border:1px solid var(--gl-border); border-radius:var(--gl-radius); padding:6px; margin-bottom:36px; box-shadow:0 2px 10px rgba(26,58,42,0.10); }
.gl-tab { flex:1; padding:15px 10px; font-size:15px; font-weight:500; cursor:pointer; border:none; background:none; color:var(--gl-text-light); border-radius:9px; transition:all 0.15s; font-family:'DM Sans',sans-serif; display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; }
.gl-tab svg { width:18px; height:18px; flex-shrink:0; }
.gl-tab:hover:not(.gl-tab-active) { color:var(--gl-text-dark); background:var(--gl-green-pale); }
.gl-tab.gl-tab-active { background:var(--gl-green-deep); color:#fff; box-shadow:0 2px 8px rgba(26,58,42,0.25); }

.gl-subtabs { display:flex; gap:10px; margin-bottom:28px; flex-wrap:wrap; }
.gl-subtab { padding:8px 22px; font-size:15px; font-weight:500; cursor:pointer; border:1px solid var(--gl-border-strong); background:none; color:var(--gl-text-light); border-radius:24px; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.gl-subtab:hover:not(.gl-subtab-active) { color:var(--gl-text-dark); }
.gl-subtab.gl-subtab-active { background:var(--gl-green-deep); color:#fff; border-color:var(--gl-green-deep); }

.gl-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
.gl-metric { background:var(--gl-white); border:1px solid var(--gl-border); border-radius:var(--gl-radius); padding:22px 24px; text-align:center; }
.gl-metric-label { font-size:12px; text-transform:uppercase; letter-spacing:0.09em; color:var(--gl-text-light); margin-bottom:8px; font-weight:500; }
.gl-metric-value { font-family:'Playfair Display',serif; font-size:32px; color:var(--gl-text-dark); }
.gl-metric-sub { font-size:13px; color:var(--gl-text-light); margin-top:4px; }

.gl-card { background:var(--gl-white); border:1px solid var(--gl-border); border-radius:var(--gl-radius-lg); padding:28px 30px; margin-bottom:22px; }
.gl-card-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:500; margin-bottom:22px; color:var(--gl-text-dark); }

.gl-table-wrap { overflow-x:auto; }
.gl-table { width:100%; border-collapse:collapse; font-size:17px; }
.gl-table th { text-align:left; padding:12px 16px; font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.08em; color:var(--gl-text-light); border-bottom:2px solid var(--gl-border); white-space:nowrap; }
.gl-table td { padding:17px 16px; border-bottom:1px solid var(--gl-border); vertical-align:middle; }
.gl-table tr:last-child td { border-bottom:none; }
.gl-table tbody tr:hover td { background:var(--gl-green-pale); }
.gl-pname { font-weight:500; font-size:17px; }
.gl-muted { color:var(--gl-text-light); font-size:15px; }

.gl-badge { display:inline-block; font-size:14px; font-weight:500; padding:4px 13px; border-radius:24px; line-height:1.6; }
.gl-badge-up { background:#e6f4eb; color:#1a6b33; }
.gl-badge-down { background:#fcecea; color:#9b2828; }
.gl-badge-even { background:var(--gl-green-pale); color:var(--gl-text-mid); }
.gl-badge-sub { background:#fdf7e6; color:#7a5c10; font-size:13px; padding:2px 10px; }
.gl-badge-win { background:#e6f4eb; color:#1a6b33; font-size:13px; padding:3px 10px; }
.gl-badge-loss { background:#fcecea; color:#9b2828; font-size:13px; padding:3px 10px; }
.gl-badge-tie { background:#f0f0ea; color:#5a5a4a; font-size:13px; padding:3px 10px; }
.gl-badge-playoff { background:#e6f1fb; color:#185fa5; font-size:13px; padding:3px 10px; }
.gl-badge-bye { background:#fdf7e6; color:#7a5c10; font-size:13px; padding:3px 10px; }
.gl-net-pos { color:#1a6b33; font-weight:500; }
.gl-net-neg { color:#9b2828; font-weight:500; }
.gl-rank-num { font-size:16px; font-weight:500; color:var(--gl-text-light); }

.gl-matchup-card { border:1px solid var(--gl-border); border-radius:var(--gl-radius); padding:20px 22px; margin-bottom:16px; background:var(--gl-white); }
.gl-vs-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; margin-bottom:14px; }
.gl-team-side-name { font-weight:500; font-size:18px; }
.gl-team-side-detail { font-size:15px; color:var(--gl-text-light); margin-top:4px; }
.gl-vs { font-size:15px; font-weight:500; color:var(--gl-text-light); text-align:center; }
.gl-result-row { display:flex; align-items:center; gap:10px; font-size:15px; color:var(--gl-text-mid); border-top:1px solid var(--gl-border); padding-top:12px; }

.gl-score-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.gl-score-panel { background:var(--gl-green-pale); border-radius:var(--gl-radius); padding:18px 20px; }
.gl-score-panel-title { font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:0.08em; color:var(--gl-text-mid); margin-bottom:14px; }

.gl-form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:18px; }
.gl-field label { display:block; font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:0.07em; color:var(--gl-text-light); margin-bottom:7px; }
#golf-league-app input[type="text"],
#golf-league-app input[type="number"],
#golf-league-app input[type="date"],
#golf-league-app select { width:100%; padding:11px 14px; font-size:17px; font-family:'DM Sans',sans-serif; border:1px solid var(--gl-border-strong); border-radius:var(--gl-radius); background:var(--gl-white); color:var(--gl-text-dark); outline:none; }
#golf-league-app input:focus, #golf-league-app select:focus { border-color:var(--gl-green-light); box-shadow:0 0 0 3px rgba(74,140,92,0.12); }

.gl-hint { font-size:15px; color:var(--gl-text-mid); background:var(--gl-gold-pale); border:1px solid rgba(201,168,76,0.3); border-radius:var(--gl-radius); padding:10px 14px; margin-top:10px; }
.gl-notice { font-size:15px; color:var(--gl-text-mid); background:var(--gl-green-pale); border-radius:var(--gl-radius); padding:13px 17px; margin-top:14px; border-left:4px solid var(--gl-green-light); line-height:1.6; }

.gl-btn { background:var(--gl-green-deep); color:#fff; border:none; padding:13px 28px; border-radius:var(--gl-radius); font-size:16px; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background 0.15s; }
.gl-btn:hover { background:var(--gl-green-mid); }
.gl-btn-sm { background:none; border:1px solid var(--gl-border-strong); color:var(--gl-text-light); padding:6px 14px; border-radius:8px; cursor:pointer; font-size:14px; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
.gl-btn-sm:hover { color:#9b2828; border-color:#9b2828; }

.gl-sep { border:none; border-top:1px solid var(--gl-border); margin:20px 0; }
.gl-empty { text-align:center; padding:48px 24px; color:var(--gl-text-light); }
.gl-empty p { font-size:16px; }

.gl-week-selector { display:flex; align-items:flex-end; gap:14px; margin-bottom:24px; flex-wrap:wrap; }
.gl-week-selector .gl-field { flex:1; min-width:220px; max-width:340px; }

.gl-playoff-bracket { display:flex; gap:24px; overflow-x:auto; padding-bottom:10px; }
.gl-playoff-round { min-width:200px; }
.gl-playoff-round-title { font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.09em; color:var(--gl-text-light); margin-bottom:14px; }
.gl-playoff-match { border:1px solid var(--gl-border); border-radius:var(--gl-radius); margin-bottom:16px; overflow:hidden; }
.gl-playoff-team { padding:12px 16px; font-size:15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--gl-border); }
.gl-playoff-team:last-child { border-bottom:none; }
.gl-playoff-team.winner { background:var(--gl-green-pale); font-weight:500; }
.gl-playoff-team.tbd { color:var(--gl-text-light); font-style:italic; }

@media (max-width:640px) {
  .gl-metrics { grid-template-columns:repeat(2,1fr); }
  .gl-tab span { display:none; }
  .gl-table th, .gl-table td { padding:10px 8px; font-size:15px; }
  .gl-score-grid { grid-template-columns:1fr; }
  .gl-vs-row { grid-template-columns:1fr auto 1fr; }
  .gl-body { padding:24px 16px 40px; }
}
</style>

  var q = parseFloat(p.handicap);
  if(isNaN(q)) return;
  // seed 3 rounds so quota calculation starts correctly
  for(var i=0;i<3;i++){
    DEFAULT_ROUNDS.push({
      id:"seed-"+p.id+"-"+i,
      playerId:p.id,
      teamId:p.teamId||null,
      date:SEED_DATE,
      points:q,
      notes:"Opening quota seed",
      isSub:false,
      seed:true
    });

// ── Quota (one decimal, ignoring seed rounds for "at time" calc) ─────────
function getQuota(pid){
  var rds=S.rounds.filter(function(r){return r.playerId===pid&&!r.seed;})
    .sort(function(a,b){return new Date(b.date)-new Date(a.date);}).slice(0,3);
  if(rds.length){
    return Math.round(rds.reduce(function(s,r){return s+r.points;},0)/rds.length*10)/10;
  }
  // fall back to seed rounds
  var seeds=S.rounds.filter(function(r){return r.playerId===pid&&r.seed;}).slice(0,3);
  if(!seeds.length) return null;
  return Math.round(seeds.reduce(function(s,r){return s+r.points;},0)/seeds.length*10)/10;
}

function getQuotaAt(pid,before){
  var rds=S.rounds.filter(function(r){return r.playerId===pid&&!r.seed&&r.date<before;})
    .sort(function(a,b){return new Date(b.date)-new Date(a.date);}).slice(0,3);
  if(rds.length){
    return Math.round(rds.reduce(function(s,r){return s+r.points;},0)/rds.length*10)/10;
  }
  var seeds=S.rounds.filter(function(r){return r.playerId===pid&&r.seed;}).slice(0,3);
  if(!seeds.length) return null;
  return Math.round(seeds.reduce(function(s,r){return s+r.points;},0)/seeds.length*10)/10;
}

// ── Team net for date ────────────────────────────────────────────────────
function teamNetOnDate(teamId,date){
  var rds=S.rounds.filter(function(r){return r.teamId===teamId&&r.date===date&&!r.seed;});
  if(!rds.length) return null;
  var net=0;
  rds.forEach(function(r){ var q=getQuotaAt(r.playerId,r.date); net+=r.points-(q!==null?q:r.points); });
  return Math.round(net*10)/10;
}

function matchupResult(m,date){
  var hn=teamNetOnDate(m.home,date), an=teamNetOnDate(m.away,date);
  if(hn===null||an===null) return {played:false};
  return {played:true,homeNet:hn,awayNet:an,homeWin:hn>an,awayWin:an>hn,tie:hn===an};
}

// ── Team stats — combine seed records + live results ─────────────────────
function teamStats(teamId){
  var sr=S.seedRecords&&S.seedRecords[teamId]?S.seedRecords[teamId]:{w:0,l:0,t:0};
  var wins=sr.w, losses=sr.l, ties=sr.t*0.5, seasonNet=0, weeksPlayed=sr.w+sr.l+(sr.t>0?sr.t:0);
  S.schedule.forEach(function(week){
    week.matchups.forEach(function(m){
      var isHome=m.home===teamId, isAway=m.away===teamId;
      if(!isHome&&!isAway) return;
      var res=matchupResult(m,week.date);
      if(!res.played) return;
      weeksPlayed++;
      var myNet=isHome?res.homeNet:res.awayNet;
      seasonNet+=myNet;
      if(res.tie){ ties+=0.5; }
      else if((isHome&&res.homeWin)||(isAway&&res.awayWin)){ wins++; }
      else { losses++; }
    });
  });
  return {wins:wins,losses:losses,ties:ties,seasonNet:Math.round(seasonNet*10)/10,weeksPlayed:weeksPlayed};
}

// ── Leaderboards ─────────────────────────────────────────────────────────
function buildTeamLB(){
  return S.teams.map(function(t){
    var stats=teamStats(t.id);
    var members=S.players.filter(function(p){return p.teamId===t.id;});
    var pts=stats.wins+stats.ties;
    return {team:t,members:members,pts:pts,wins:stats.wins,losses:stats.losses,ties:stats.ties,seasonNet:stats.seasonNet,weeksPlayed:stats.weeksPlayed};
  }).sort(function(a,b){
    if(b.pts!==a.pts) return b.pts-a.pts;
    return b.seasonNet-a.seasonNet;
  });
}

function buildPlayerLB(){
  return S.players.map(function(p){
    var rds=S.rounds.filter(function(r){return r.playerId===p.id&&!r.seed;})
      .sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    var quota=getQuota(p.id);
    var net=0;
    rds.forEach(function(r){ var q=getQuotaAt(p.id,r.date); net+=r.points-(q!==null?q:r.points); });
    return {player:p,quota:quota,rounds:rds.length,
      lastPoints:rds[0]?rds[0].points:null,lastDate:rds[0]?rds[0].date:null,
      seasonNet:rds.length?Math.round(net*10)/10:null};
  }).sort(function(a,b){
    if(a.seasonNet===null&&b.seasonNet===null) return 0;
    if(a.seasonNet===null) return 1; if(b.seasonNet===null) return -1;
    return b.seasonNet-a.seasonNet;
  });
}

        +'</div>';
    });

        subOpts+='<option value="'+p.id+'"'+(subs[0]&&subs[0].playerId===p.id?' selected':'')+'>'+p.name+(p.teamId?' ('+teamName(p.teamId)+')':' (sub pool)')+'</option>';

      +'<div style="font-size:13px;color:var(--gl-text-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.07em">Sub (optional)</div>'

      +'<input type="number" id="gl-subpts-'+side+'" min="0" max="72" placeholder="Sub points" value="'+(exSub?exSub.points:'')+'"></div>';

  function collectSide(side,teamId,members){
    members.forEach(function(p){
      var pts=parseFloat((el('gl-pts-'+side+'-'+p.id)||{value:''}).value);
      if(!isNaN(pts)&&pts>=0)toSave.push({id:uid(),playerId:p.id,teamId:teamId,date:date,points:pts,notes:'',isSub:false});
    });
    var subPid=(el('gl-sub-'+side)||{value:''}).value;
    var subPts=parseFloat((el('gl-subpts-'+side)||{value:''}).value);
    if(subPid&&!isNaN(subPts)&&subPts>=0)toSave.push({id:uid(),playerId:subPid,teamId:teamId,date:date,points:subPts,notes:'',isSub:true});
  }
  collectSide('h',m.home,S.players.filter(function(p){return p.teamId===m.home;}));
  collectSide('a',m.away,S.players.filter(function(p){return p.teamId===m.away;}));
  if(!toSave.length){alert('Please enter at least one score.');return;}
  S.rounds=S.rounds.filter(function(r){return r.seed||!((r.teamId===m.home||r.teamId===m.away)&&r.date===date);});
  toSave.forEach(function(r){S.rounds.push(r);});
  save();
  var hint=el('gl-save-hint');if(hint){hint.textContent='Saved!';setTimeout(function(){hint.textContent='';},2500);}
  glBuildMatchupList();
};

// ── Render: Roster ───────────────────────────────────────────────────────
function glRenderRoster(){
  var html='<div class="gl-card"><p class="gl-card-title">Add player</p>'
    +'<div class="gl-form-grid">'
    +'<div class="gl-field"><label>Name</label><input type="text" id="gl-p-name" placeholder="Full name"></div>'
    +'<div class="gl-field"><label>Team</label><select id="gl-p-team"><option value="">— sub pool —</option>'
    +S.teams.map(function(t){return '<option value="'+t.id+'">'+t.name+'</option>';}).join('')+'</select></div>'
    +'<div class="gl-field"><label>Starting quota</label><input type="number" id="gl-p-hcp" placeholder="e.g. 14.2" step="0.1"></div>'
    +'</div><button class="gl-btn" onclick="glAddPlayer()">Add player</button></div>';

  S.teams.forEach(function(t){
    var members=S.players.filter(function(p){return p.teamId===t.id;});
    html+='<div class="gl-card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">'
      +'<span class="gl-card-title" style="margin-bottom:0">'+t.name+'</span>'
      +'<span class="gl-muted">'+members.length+'/2</span></div>';
    if(!members.length){html+='<p class="gl-muted">No players yet.</p>';}
    else{
      html+='<table class="gl-table"><thead><tr><th>Player</th><th>Starting quota</th><th>Current quota</th><th>Rounds</th><th></th></tr></thead><tbody>';
      members.forEach(function(p){
        var q=getQuota(p.id),rds=S.rounds.filter(function(r){return r.playerId===p.id&&!r.seed;}).length;
        html+='<tr><td class="gl-pname">'+p.name+'</td><td class="gl-muted">'+(p.handicap||'—')+'</td>'
          +'<td>'+(q!==null?q:'<span class="gl-muted">—</span>')+'</td>'
          +'<td class="gl-muted">'+rds+'</td>'
          +'<td><button class="gl-btn-sm" onclick="glRemovePlayer(\''+p.id+'\')">Remove</button></td></tr>';
      });
      html+='</tbody></table>';
    }
    html+='</div>';
  });

  var subs=S.players.filter(function(p){return !p.teamId;});
  if(subs.length){
    html+='<div class="gl-card"><p class="gl-card-title">Sub pool</p>'
      +'<table class="gl-table"><thead><tr><th>Player</th><th>Starting quota</th><th>Current quota</th><th>Rounds</th><th></th></tr></thead><tbody>';
    subs.forEach(function(p){
      var q=getQuota(p.id),rds=S.rounds.filter(function(r){return r.playerId===p.id&&!r.seed;}).length;
      html+='<tr><td class="gl-pname">'+p.name+' <span class="gl-badge gl-badge-sub">sub</span></td>'
        +'<td class="gl-muted">'+(p.handicap||'—')+'</td>'
        +'<td>'+(q!==null?q:'<span class="gl-muted">—</span>')+'</td>'
        +'<td class="gl-muted">'+rds+'</td>'
        +'<td><button class="gl-btn-sm" onclick="glRemovePlayer(\''+p.id+'\')">Remove</button></td></tr>';
    });
    html+='</tbody></table></div>';
  }
  el('gl-roster').innerHTML=html;
}
window.glAddPlayer=function(){
  var name=(el('gl-p-name')||{value:''}).value.trim();
  var teamId=(el('gl-p-team')||{value:''}).value||null;
  var hcp=(el('gl-p-hcp')||{value:''}).value.trim();
  if(!name){alert('Please enter a name.');return;}
  if(S.players.filter(function(p){return p.name.toLowerCase()===name.toLowerCase();}).length){alert('Player already exists.');return;}
  if(teamId&&S.players.filter(function(p){return p.teamId===teamId;}).length>=2){alert('Teams can only have 2 permanent members.');return;}
  var newP={id:uid(),name:name,teamId:teamId,handicap:hcp};
  S.players.push(newP);
  // seed quota if provided
  if(hcp){var q=parseFloat(hcp);if(!isNaN(q)){for(var i=0;i<3;i++)S.rounds.push({id:"seed-"+newP.id+"-"+i,playerId:newP.id,teamId:teamId,date:SEED_DATE,points:q,notes:"Opening quota seed",isSub:false,seed:true});}}
  save();glRenderRoster();
};
window.glRemovePlayer=function(id){
  var p=S.players.filter(function(x){return x.id===id;})[0];
  if(!confirm('Remove '+(p?p.name:'this player')+' and all their scores?'))return;
  S.players=S.players.filter(function(x){return x.id!==id;});
  S.rounds=S.rounds.filter(function(r){return r.playerId!==id;});
  save();glRenderRoster();
};

// ── Render: Playoffs ─────────────────────────────────────────────────────
function glRenderPlayoffs(){
  var lb=buildTeamLB(),top6=lb.slice(0,6);
  var html='<div class="gl-card"><p class="gl-card-title">Playoff seeds</p>'
    +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
    +'<th>Seed</th><th>Team</th><th>Record</th><th>Notes</th></tr></thead><tbody>';
  top6.forEach(function(row,i){
    var seed=i+1,rec=row.wins+'-'+row.losses+(row.ties?'-'+row.ties:'');
    var bye=seed<=2?'<span class="gl-badge gl-badge-bye">First round bye</span>':'';
    html+='<tr><td style="font-weight:600;font-size:18px">'+(seed<=2?'⭐ ':'')+seed+'</td>'
      +'<td class="gl-pname">'+row.team.name+'</td>'
      +'<td class="gl-muted">'+rec+'</td><td>'+bye+'</td></tr>';
  });
  html+='</tbody></table></div>'
    +'<div class="gl-notice">Seeds 1 &amp; 2 receive a first-round bye. Seeds 3 vs 6 and 4 vs 5 play in Round 1.</div></div>';

  var s=top6.map(function(r){return r.team;});
  function pr(round,match){return S.playoffResults.filter(function(r){return r.round===round&&r.match===match;})[0]||null;}
  var r1a={home:s[2]?s[2].name:'Seed 3',away:s[5]?s[5].name:'Seed 6'};
  var r1b={home:s[3]?s[3].name:'Seed 4',away:s[4]?s[4].name:'Seed 5'};
  var p3v6=pr(1,'3v6'),p4v5=pr(1,'4v5');
  var sf1b=p3v6?(p3v6.winner===0?r1a.home:r1a.away):'Winner (3v6)';
  var sf2b=p4v5?(p4v5.winner===0?r1b.home:r1b.away):'Winner (4v5)';
  var psf1=pr(2,'sf1'),psf2=pr(2,'sf2');
  var finA=psf1?(psf1.winner===0?(s[0]?s[0].name:'Seed 1'):sf1b):'Winner SF1';
  var finB=psf2?(psf2.winner===0?(s[1]?s[1].name:'Seed 2'):sf2b):'Winner SF2';

  function pmatch(round,matchKey,tA,tB){
    var res=pr(round,matchKey);
    var wA=res&&res.winner===0,wB=res&&res.winner===1;
    return '<div class="gl-playoff-match"><div class="gl-playoff-team'+(wA?' winner':!tA?' tbd':'')+'">'+(tA||'TBD')+(wA?' 🏆':'')+'</div>'
      +'<div class="gl-playoff-team'+(wB?' winner':!tB?' tbd':'')+'">'+(tB||'TBD')+(wB?' 🏆':'')+'</div></div>';
  }

  html+='<div class="gl-card"><p class="gl-card-title">Bracket</p>'
    +'<div class="gl-playoff-bracket">'
    +'<div class="gl-playoff-round"><div class="gl-playoff-round-title">Round 1</div>'
    +pmatch(1,'3v6',r1a.home,r1a.away)+pmatch(1,'4v5',r1b.home,r1b.away)+'</div>'
    +'<div class="gl-playoff-round"><div class="gl-playoff-round-title">Semifinals</div>'
    +pmatch(2,'sf1',s[0]?s[0].name:'Seed 1',sf1b)+pmatch(2,'sf2',s[1]?s[1].name:'Seed 2',sf2b)+'</div>'
    +'<div class="gl-playoff-round"><div class="gl-playoff-round-title">Championship</div>'
    +pmatch(3,'final',finA,finB)+'</div></div>';

  html+='<hr class="gl-sep"><p style="font-size:15px;font-weight:500;margin-bottom:16px;color:var(--gl-text-mid)">Record playoff result</p>'
    +'<div class="gl-form-grid">'
    +'<div class="gl-field"><label>Matchup</label><select id="gl-po-round">'
    +'<option value="1-3v6">R1: '+r1a.home+' vs '+r1a.away+'</option>'
    +'<option value="1-4v5">R1: '+r1b.home+' vs '+r1b.away+'</option>'
    +'<option value="2-sf1">SF1: '+(s[0]?s[0].name:'Seed 1')+' vs '+sf1b+'</option>'
    +'<option value="2-sf2">SF2: '+(s[1]?s[1].name:'Seed 2')+' vs '+sf2b+'</option>'
    +'<option value="3-final">Final: '+finA+' vs '+finB+'</option>'
    +'</select></div>'
    +'<div class="gl-field"><label>Winner</label><select id="gl-po-winner"><option value="0">First named team</option><option value="1">Second named team</option></select></div>'
    +'</div><button class="gl-btn" onclick="glSavePlayoffResult()">Save result</button></div>';

  el('gl-playoffs').innerHTML=html;
}
window.glSavePlayoffResult=function(){
  var rsel=el('gl-po-round'),wsel=el('gl-po-winner');if(!rsel||!wsel)return;
  var parts=rsel.value.split('-'),round=parseInt(parts[0]),match=parts.slice(1).join('-'),winner=parseInt(wsel.value);
  S.playoffResults=S.playoffResults.filter(function(r){return!(r.round===round&&r.match===match);});
  S.playoffResults.push({round:round,match:match,winner:winner});
  save();glRenderPlayoffs();
};

// ── Render: Prizes ───────────────────────────────────────────────────────
function getIndivWinnerForWeek(weekDate){
  var rounds=S.rounds.filter(function(r){return r.date===weekDate&&!r.seed;});
  if(!rounds.length) return null;
  var best=null,bestMargin=null;
  rounds.forEach(function(r){
    var q=getQuotaAt(r.playerId,r.date);if(q===null)return;
    var margin=Math.round((r.points-q)*10)/10;
    if(bestMargin===null||margin>bestMargin){bestMargin=margin;best={playerId:r.playerId,points:r.points,quota:q,margin:margin};}
  });
  return best;
}
function buildIndivPrizeLB(){
  var players={};
  S.schedule.forEach(function(week){
    var winner=getIndivWinnerForWeek(week.date);if(!winner)return;
    var pid=winner.playerId;
    if(!players[pid])players[pid]={wins:0,bestMargin:null,bestWeek:null};
    players[pid].wins++;
    if(players[pid].bestMargin===null||winner.margin>players[pid].bestMargin){players[pid].bestMargin=winner.margin;players[pid].bestWeek=week.week;}
  });
  return Object.keys(players).map(function(pid){
    var p=playerById(pid);
    return {player:p,wins:players[pid].wins,bestMargin:players[pid].bestMargin,bestWeek:players[pid].bestWeek};
  }).sort(function(a,b){return b.wins!==a.wins?b.wins-a.wins:b.bestMargin-a.bestMargin;});
}

function glRenderPrizes(){
  var weekOpts=S.schedule.map(function(w){return '<option value="'+w.week+'">Week '+w.week+' — '+w.date+'</option>';}).join('');
  var playerOpts='<option value="">— select player —</option>'+S.players.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('');

  var html='<div class="gl-card"><p class="gl-card-title">Enter closest to the pin</p>'
    +'<div class="gl-form-grid">'
    +'<div class="gl-field"><label>Week</label><select id="gl-ctp-week">'+weekOpts+'</select></div>'
    +'<div class="gl-field"><label>Hole #</label><input type="number" id="gl-ctp-hole" min="1" max="18" placeholder="e.g. 7"></div>'
    +'<div class="gl-field"><label>CTP 1 — Player</label><select id="gl-ctp1-player">'+playerOpts+'</select></div>'
    +'<div class="gl-field"><label>CTP 1 — Distance</label><input type="text" id="gl-ctp1-dist" placeholder="e.g. 4\'2&quot;"></div>'
    +'<div class="gl-field"><label>CTP 2 — Player</label><select id="gl-ctp2-player">'+playerOpts+'</select></div>'
    +'<div class="gl-field"><label>CTP 2 — Distance</label><input type="text" id="gl-ctp2-dist" placeholder="e.g. 6\'8&quot;"></div>'
    +'</div><button class="gl-btn" onclick="glSaveCTP()">Save CTP results</button></div>';

  var ctpRows=S.ctp.slice().sort(function(a,b){return b.week-a.week;});
  if(ctpRows.length){
    html+='<div class="gl-card"><p class="gl-card-title">Closest to the pin results</p>'
      +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
      +'<th>Week</th><th>Date</th><th>Hole</th><th>Winner</th><th>Distance</th><th></th>'
      +'</tr></thead><tbody>';
    ctpRows.forEach(function(c){
      var week=S.schedule.filter(function(w){return w.week===c.week;})[0];
      var date=week?week.date:'';
      var p=playerById(c.playerId);
      html+='<tr><td class="gl-muted">'+c.week+'</td><td class="gl-muted">'+date+'</td>'
        +'<td style="font-weight:500">'+(c.hole?'Hole '+c.hole:'—')+'</td>'
        +'<td class="gl-pname">'+( p?p.name:'(deleted)')+'</td>'
        +'<td>'+(c.distance||'—')+'</td>'
        +'<td><button class="gl-btn-sm" onclick="glDeleteCTP(\''+c.id+'\')">Del</button></td></tr>';
    });
    html+='</tbody></table></div></div>';
  }

  var ctpTally={};
  S.ctp.forEach(function(c){ctpTally[c.playerId]=(ctpTally[c.playerId]||0)+1;});
  var ctpLB=Object.keys(ctpTally).map(function(pid){return{player:playerById(pid),wins:ctpTally[pid]};}).sort(function(a,b){return b.wins-a.wins;});
  if(ctpLB.length){
    html+='<div class="gl-card"><p class="gl-card-title">CTP season leaderboard</p>'
      +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr><th>#</th><th>Player</th><th>CTP wins</th></tr></thead><tbody>';
    ctpLB.forEach(function(row,i){
      var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'<span class="gl-rank-num">'+(i+1)+'</span>';
      html+='<tr><td>'+medal+'</td><td class="gl-pname">'+(row.player?row.player.name:'(deleted)')+'</td><td style="font-weight:600;font-size:18px">'+row.wins+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
  }

  html+='<hr class="gl-sep">';

  html+='<div class="gl-card"><p class="gl-card-title">Weekly individual prize <span style="font-size:15px;font-weight:400;font-family:\'DM Sans\',sans-serif;color:var(--gl-text-light)">— $50 to most points over quota</span></p>'
    +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
    +'<th>Week</th><th>Date</th><th>Winner</th><th>Points</th><th>Quota</th><th>Over quota</th>'
    +'</tr></thead><tbody>';
  var hasAny=false;
  S.schedule.forEach(function(week){
    // prefer live-calculated winner
    var winner=getIndivWinnerForWeek(week.date);
    if(winner){
      hasAny=true;
      var p=playerById(winner.playerId);
      var sign=winner.margin>=0?'+':'';
      html+='<tr><td class="gl-muted">'+week.week+'</td><td class="gl-muted">'+week.date+'</td>'
        +'<td class="gl-pname">🏆 '+(p?p.name:'(deleted)')+'</td>'
        +'<td style="font-weight:600">'+winner.points+'</td>'
        +'<td class="gl-muted">'+winner.quota+'</td>'
        +'<td><span class="gl-badge gl-badge-up">'+sign+winner.margin+'</span></td></tr>';
    } else {
      // fall back to seeded prize winners
      var seed=(S.seedIndivPrize||[]).filter(function(s){return s.week===week.week;})[0];
      if(seed){
        hasAny=true;
        var p=playerById(seed.playerId);
        var sign=seed.margin>=0?'+':'';
        html+='<tr><td class="gl-muted">'+week.week+'</td><td class="gl-muted">'+week.date+'</td>'
          +'<td class="gl-pname">🏆 '+(p?p.name:'(deleted)')+'</td>'
          +'<td style="font-weight:600">'+(seed.points!==null?seed.points:'—')+'</td>'
          +'<td class="gl-muted">'+(seed.quota!==null?seed.quota:'—')+'</td>'
          +'<td>'+(seed.margin!==null?'<span class="gl-badge gl-badge-up">'+sign+seed.margin+'</span>':'—')+'</td></tr>';
      }
    }
  });
  if(!hasAny) html+='<tr><td colspan="6" style="text-align:center;color:var(--gl-text-light);padding:24px;font-size:15px">Winners appear automatically once scores are entered.</td></tr>';
  html+='</tbody></table></div></div>';

  var indivLB=buildIndivPrizeLB();
  if(indivLB.length){
    html+='<div class="gl-card"><p class="gl-card-title">Individual prize season leaderboard</p>'
      +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
      +'<th>#</th><th>Player</th><th>Team</th><th>Wins</th><th>Best margin</th><th>Best week</th>'
      +'</tr></thead><tbody>';
    indivLB.forEach(function(row,i){
      var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'<span class="gl-rank-num">'+(i+1)+'</span>';
      var team=row.player&&row.player.teamId?teamName(row.player.teamId):'<span class="gl-muted">Sub pool</span>';
      var sign=row.bestMargin>=0?'+':'';
      html+='<tr><td>'+medal+'</td><td class="gl-pname">'+(row.player?row.player.name:'(deleted)')+'</td>'
        +'<td class="gl-muted">'+team+'</td><td style="font-weight:600;font-size:18px">'+row.wins+'</td>'
        +'<td><span class="gl-badge gl-badge-up">'+sign+row.bestMargin+'</span></td>'
        +'<td class="gl-muted">Wk '+row.bestWeek+'</td></tr>';
    });
    html+='</tbody></table></div>'
      +'<div class="gl-notice">Winners calculated automatically from entered scores — highest points above personal quota each week.</div></div>';
  }
  el('gl-prizes').innerHTML=html;
}
window.glSaveCTP=function(){
  var week=parseInt((el('gl-ctp-week')||{value:''}).value);
  var hole=parseInt((el('gl-ctp-hole')||{value:''}).value)||0;
  if(!week){alert('Please select a week.');return;}
  var entries=[{pEl:'gl-ctp1-player',dEl:'gl-ctp1-dist'},{pEl:'gl-ctp2-player',dEl:'gl-ctp2-dist'}];
  var saved=0;
  entries.forEach(function(e){
    var pid=(el(e.pEl)||{value:''}).value,dist=(el(e.dEl)||{value:''}).value.trim();
    if(!pid)return;
    S.ctp=S.ctp.filter(function(c){return!(c.week===week&&c.hole===hole&&c.playerId===pid);});
    S.ctp.push({id:uid(),week:week,hole:hole,playerId:pid,distance:dist});
    saved++;
  });
  if(!saved){alert('Please select at least one player.');return;}
  save();alert('CTP results saved!');glRenderPrizes();
};
window.glDeleteCTP=function(id){
  if(!confirm('Delete this CTP entry?'))return;
  S.ctp=S.ctp.filter(function(c){return c.id!==id;});
  save();glRenderPrizes();
};

// ── Tab switching ────────────────────────────────────────────────────────
var GL_TABS=['standings','schedule','enter','roster','playoffs','prizes'];
window.glShowTab=function(name){
  GL_TABS.forEach(function(t){el('gl-'+t).style.display=t===name?'':'none';});
  document.querySelectorAll('.gl-tab').forEach(function(btn,i){btn.classList.toggle('gl-tab-active',GL_TABS[i]===name);});
  glRender(name);
};
function glRender(tab){
  tab=tab||'standings';
  if(tab==='standings')glRenderStandings();
  else if(tab==='schedule')glRenderSchedule();
  else if(tab==='enter')glRenderEnter();
  else if(tab==='roster')glRenderRoster();
  else if(tab==='playoffs')glRenderPlayoffs();
  else if(tab==='prizes')glRenderPrizes();
}

load();
glRender('standings');
})();
</script>
