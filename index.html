<script>
// Mobile cache buster - works inside iOS Safari iframes
// Stores a build timestamp in localStorage; if the page JS timestamp
// is newer than what's stored, clears the page cache and reloads.
(function(){
  var BUILD = '20260618-009'; // update this string with each code deploy
  var CACHE_KEY = 'gl_build';
  try {
    var stored = localStorage.getItem(CACHE_KEY);
    if(stored !== BUILD){
      localStorage.setItem(CACHE_KEY, BUILD);
      // Force hard reload bypassing cache
      if(stored !== null){
        window.location.replace(window.location.href.split('?')[0] + '?v=' + BUILD);
      }
    }
  } catch(e){}
})();
</script>

function load(){
  try {
    // ALWAYS start from the code defaults — teams, players, schedule,
    // seed rounds, CTPs and prize data are always current from the file.
    // We only preserve manually-entered rounds and playoff results from localStorage.
    var manualRounds = [];
    var playoffResults = [];

    // Check current and all previous keys for manually entered data
    var allKeys = [KEY].concat(PREV_KEYS);
    var defaultRoundIds = DEFAULT_ROUNDS.map(function(r){ return r.id; });

    for(var i=0;i<allKeys.length;i++){
      try {
        var raw = localStorage.getItem(allKeys[i]);
        if(!raw) continue;
        var old = JSON.parse(raw);
        // Grab rounds that were manually entered (not seeds, not in DEFAULT_ROUNDS)
        var manual = (old.rounds||[]).filter(function(r){
          return !r.seed && defaultRoundIds.indexOf(r.id)===-1;
        });
        if(manual.length > manualRounds.length) manualRounds = manual;
        if((old.playoffResults||[]).length > playoffResults.length) playoffResults = old.playoffResults||[];
      } catch(e){}
    }

    // S is already initialised with all defaults — just layer in manual data
    manualRounds.forEach(function(r){ S.rounds.push(r); });
    if(playoffResults.length) S.playoffResults = playoffResults;

    // Persist the merged state
    save();
  } catch(e){ save(); }
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

// ── Quota (one decimal, ignoring seed rounds for "at time" calc) ─────────
function getQuota(pid){
  var rds=S.rounds.filter(function(r){return r.playerId===pid&&!r.seed&&!r.penalty;});
  if(rds.length){
    return Math.round(rds.reduce(function(s,r){return s+r.points;},0)/rds.length*10)/10;
  }
  // fall back to starting quota seed
  var seeds=S.rounds.filter(function(r){return r.playerId===pid&&r.seed;});
  if(!seeds.length) return null;
  return seeds[0].points;
}

function getQuotaAt(pid,before){
  var rds=S.rounds.filter(function(r){return r.playerId===pid&&!r.seed&&!r.penalty&&r.date<before;});
  if(rds.length){
    return Math.round(rds.reduce(function(s,r){return s+r.points;},0)/rds.length*10)/10;
  }
  var seeds=S.rounds.filter(function(r){return r.playerId===pid&&r.seed;});
  if(!seeds.length) return null;
  return seeds[0].points;
}

// ── Team net for date ────────────────────────────────────────────────────
function teamNetOnDate(teamId,date){
  var rds=S.rounds.filter(function(r){return r.teamId===teamId&&r.date===date&&!r.seed;});
  if(!rds.length) return null;
  var net=0;
  var hasPenalty=rds.filter(function(r){return r.penalty;}).length>0;
  rds.filter(function(r){return !r.penalty;}).forEach(function(r){
    var q=getQuotaAt(r.playerId,r.date);
    net+=r.points-(q!==null?q:r.points);
  });
  if(hasPenalty) net-=3;
  return Math.round(net*10)/10;
}

function matchupResult(m,date){
  var hn=teamNetOnDate(m.home,date), an=teamNetOnDate(m.away,date);
  if(hn===null||an===null) return {played:false};
  return {played:true,homeNet:hn,awayNet:an,homeWin:hn>an,awayWin:an>hn,tie:hn===an};
}

// ── Team stats — combine seed records + live results ─────────────────────
function teamStats(teamId){
  var sr=S.seedRecords&&S.seedRecords[teamId]?S.seedRecords[teamId]:{w:0,l:0,t:0};
  var wins=sr.w, losses=sr.l, ties=sr.t*0.5, seasonNet=0, weeksPlayed=sr.w+sr.l+(sr.t>0?sr.t:0);
  S.schedule.forEach(function(week){
    week.matchups.forEach(function(m){
      var isHome=m.home===teamId, isAway=m.away===teamId;
      if(!isHome&&!isAway) return;
      var res=matchupResult(m,week.date);
      if(!res.played) return;
      weeksPlayed++;
      var myNet=isHome?res.homeNet:res.awayNet;
      seasonNet+=myNet;
      if(res.tie){ ties+=0.5; }
      else if((isHome&&res.homeWin)||(isAway&&res.awayWin)){ wins++; }
      else { losses++; }
    });
  });
  return {wins:wins,losses:losses,ties:ties,seasonNet:Math.round(seasonNet*10)/10,weeksPlayed:weeksPlayed};
}

// ── Leaderboards ─────────────────────────────────────────────────────────
function buildTeamLB(){
  return S.teams.map(function(t){
    var stats=teamStats(t.id);
    var members=S.players.filter(function(p){return p.teamId===t.id;});
    var pts=stats.wins+stats.ties;
    return {team:t,members:members,pts:pts,wins:stats.wins,losses:stats.losses,ties:stats.ties,seasonNet:stats.seasonNet,weeksPlayed:stats.weeksPlayed};
  }).sort(function(a,b){
    if(b.pts!==a.pts) return b.pts-a.pts;
    return b.seasonNet-a.seasonNet;
  });
}

function buildPlayerLB(){
  return S.players.map(function(p){
    var rds=S.rounds.filter(function(r){return r.playerId===p.id&&!r.seed;})
      .sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    var quota=getQuota(p.id);
    var net=0;
    rds.forEach(function(r){ var q=getQuotaAt(p.id,r.date); net+=r.points-(q!==null?q:r.points); });
    return {player:p,quota:quota,rounds:rds.length,
      lastPoints:rds[0]?rds[0].points:null,lastDate:rds[0]?rds[0].date:null,
      seasonNet:rds.length?Math.round(net*10)/10:null};
  }).sort(function(a,b){
    if(a.seasonNet===null&&b.seasonNet===null) return 0;
    if(a.seasonNet===null) return 1; if(b.seasonNet===null) return -1;
    return b.seasonNet-a.seasonNet;
  });
}

window.glSelectMatchup=function(mi){enterMatchup=(enterMatchup===mi)?null:mi;glBuildMatchupList();};
window.glBuildScoreEntry=function(weekData,m,mi){
  var seEl=el('gl-score-entry');if(!seEl)return;
  var date=weekData.date;
  var homeMembers=S.players.filter(function(p){return p.teamId===m.home;});
  var awayMembers=S.players.filter(function(p){return p.teamId===m.away;});
  function buildPanel(teamId,teamObj,members,side){
    var existing=S.rounds.filter(function(r){return r.teamId===teamId&&r.date===date&&!r.seed;});
    var subs=existing.filter(function(r){return !members.filter(function(mm){return mm.id===r.playerId;}).length;});
    var penaltyKey='gl-penalty-'+side;
    var existingPenalty=S.rounds.filter(function(r){return r.teamId===teamId&&r.date===date&&r.penalty;}).length>0;
    var html='<div class="gl-score-panel"><div class="gl-score-panel-title">'+(teamObj?teamObj.name:'?')+'</div>';
    members.forEach(function(p){
      var ex=existing.filter(function(r){return r.playerId===p.id;})[0];
      var q=getQuotaAt(p.id,date);
      html+='<div style="margin-bottom:14px">'
        +'<div style="font-size:16px;font-weight:500;margin-bottom:5px">'+p.name
        +'<span style="font-weight:400;color:var(--gl-text-light);font-size:14px"> — quota: '+(q!==null?q:'n/a')+'</span></div>'
        +'<input type="number" id="gl-pts-'+side+'-'+p.id+'" min="0" max="72" placeholder="Points" value="'+(ex?ex.points:'')+'" oninput="glShowPtsHint(\''+side+'\',\''+p.id+'\',\''+date+'\')">'
        +'<div id="gl-phint-'+side+'-'+p.id+'" style="font-size:14px;color:var(--gl-text-mid);margin-top:4px;min-height:18px"></div>'
        +'</div>';
    });
    var subOpts='<option value="">— no sub —</option>';
    S.players.forEach(function(p){
      if(!members.filter(function(mm){return mm.id===p.id;}).length)
        subOpts+='<option value="'+p.id+'"'+(subs[0]&&subs[0].playerId===p.id?' selected':'')+'>'+p.name+(p.teamId?' ('+teamName(p.teamId)+')':' (sub pool)')+'</option>';
    });
    var exSub=subs[0];
    html+='<div style="padding-top:10px;border-top:1px solid rgba(26,58,42,0.1)">'
      +'<div style="font-size:13px;color:var(--gl-text-light);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.07em">Sub (optional)</div>'
      +'<select id="gl-sub-'+side+'" style="margin-bottom:8px">'+subOpts+'</select>'
      +'<input type="number" id="gl-subpts-'+side+'" min="0" max="72" placeholder="Sub points" value="'+(exSub?exSub.points:'')+'"></div>'
      +'<div style="padding-top:10px;margin-top:8px;border-top:1px solid rgba(26,58,42,0.1)">'
      +'<label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--gl-text-mid)">'
      +'<input type="checkbox" id="'+penaltyKey+'"'+(existingPenalty?' checked':'')+' style="width:18px;height:18px">'
      +'Partner absent, no sub found <span style="color:#9b2828;font-size:13px">(+3 penalty to team quota)</span>'
      +'</label></div>';
    html+='</div>';
    return html;
  }
  var html='<div class="gl-score-grid" onclick="event.stopPropagation()">'+buildPanel(m.home,teamById(m.home),homeMembers,'h')+buildPanel(m.away,teamById(m.away),awayMembers,'a')+'</div>'
    +'<div style="margin-top:24px;padding:20px;background:var(--gl-green-pale);border-radius:var(--gl-radius);border:2px solid var(--gl-green-light)" onclick="event.stopPropagation()">'
    +'<div style="font-size:15px;color:var(--gl-text-mid);margin-bottom:14px">When all scores are entered above, click to save this round:</div>'
    +'<button class="gl-btn" style="width:100%;padding:18px;font-size:18px;letter-spacing:0.02em" onclick="event.stopPropagation();glSaveMatchupScores('+mi+')">&#10003; &nbsp;Save Round Scores</button>'
    +'<div id="gl-save-hint" style="font-size:15px;color:#1a6b33;font-weight:500;margin-top:12px;text-align:center"></div>'
    +'</div>';
  seEl.innerHTML=html;
  homeMembers.forEach(function(p){if(el('gl-pts-h-'+p.id)&&el('gl-pts-h-'+p.id).value)glShowPtsHint('h',p.id,date);});
  awayMembers.forEach(function(p){if(el('gl-pts-a-'+p.id)&&el('gl-pts-a-'+p.id).value)glShowPtsHint('a',p.id,date);});
};
window.glShowPtsHint=function(side,pid,date){
  var hintEl=el('gl-phint-'+side+'-'+pid);if(!hintEl)return;
  var ptsEl=el('gl-pts-'+side+'-'+pid);if(!ptsEl)return;
  var pts=parseFloat(ptsEl.value),q=getQuotaAt(pid,date);
  if(q===null){hintEl.textContent='No quota yet';return;}
  if(!isNaN(pts)){var diff=Math.round((pts-q)*10)/10;hintEl.textContent='vs quota: '+(diff>=0?'+':'')+diff;hintEl.style.color=diff>=0?'#1a6b33':'#9b2828';}
  else{hintEl.textContent='';}
};
window.glSaveMatchupScores=function(mi){
  var weekData=S.schedule.filter(function(w){return w.week===enterWeek;})[0];if(!weekData)return;
  var m=weekData.matchups[mi],date=weekData.date,toSave=[];
  function collectSide(side,teamId,members){
    members.forEach(function(p){
      var pts=parseFloat((el('gl-pts-'+side+'-'+p.id)||{value:''}).value);
      if(!isNaN(pts)&&pts>=0)toSave.push({id:uid(),playerId:p.id,teamId:teamId,date:date,points:pts,notes:'',isSub:false});
    });
    var subPid=(el('gl-sub-'+side)||{value:''}).value;
    var subPts=parseFloat((el('gl-subpts-'+side)||{value:''}).value);
    if(subPid&&!isNaN(subPts)&&subPts>=0)toSave.push({id:uid(),playerId:subPid,teamId:teamId,date:date,points:subPts,notes:'',isSub:true});
    // penalty flag
    var penaltyEl=el('gl-penalty-'+side);
    if(penaltyEl&&penaltyEl.checked)toSave.push({id:uid(),playerId:null,teamId:teamId,date:date,points:0,notes:'Absent partner penalty',isSub:false,penalty:true});
  }
  collectSide('h',m.home,S.players.filter(function(p){return p.teamId===m.home;}));
  collectSide('a',m.away,S.players.filter(function(p){return p.teamId===m.away;}));
  if(!toSave.filter(function(r){return !r.penalty;}).length){alert('Please enter at least one score.');return;}
  S.rounds=S.rounds.filter(function(r){return r.seed||!((r.teamId===m.home||r.teamId===m.away)&&r.date===date);});
  toSave.forEach(function(r){S.rounds.push(r);});
  save();
  var hint=el('gl-save-hint');
  if(hint){
    hint.innerHTML='&#10003; &nbsp;Round saved successfully!';
    hint.style.color='#1a6b33';
  }
  // Refresh matchup list but keep this matchup open
  glBuildMatchupList();
};

window.glAddPlayer=function(){
  var name=(el('gl-p-name')||{value:''}).value.trim();
  var teamId=(el('gl-p-team')||{value:''}).value||null;
  var hcp=(el('gl-p-hcp')||{value:''}).value.trim();
  if(!name){alert('Please enter a name.');return;}
  if(S.players.filter(function(p){return p.name.toLowerCase()===name.toLowerCase();}).length){alert('Player already exists.');return;}
  if(teamId&&S.players.filter(function(p){return p.teamId===teamId;}).length>=2){alert('Teams can only have 2 permanent members.');return;}
  var newP={id:uid(),name:name,teamId:teamId,handicap:hcp};
  S.players.push(newP);
  // seed quota if provided
  if(hcp){var q=parseFloat(hcp);if(!isNaN(q)){for(var i=0;i<3;i++)S.rounds.push({id:"seed-"+newP.id+"-"+i,playerId:newP.id,teamId:teamId,date:SEED_DATE,points:q,notes:"Opening quota seed",isSub:false,seed:true});}}
  save();glRenderRoster();
};
window.glRemovePlayer=function(id){
  var p=S.players.filter(function(x){return x.id===id;})[0];
  if(!confirm('Remove '+(p?p.name:'this player')+' and all their scores?'))return;
  S.players=S.players.filter(function(x){return x.id!==id;});
  S.rounds=S.rounds.filter(function(r){return r.playerId!==id;});
  save();glRenderRoster();
};

// ── Render: Playoffs ─────────────────────────────────────────────────────
function glRenderPlayoffs(){
  var lb=buildTeamLB(),top6=lb.slice(0,6);
  var html='<div class="gl-card"><p class="gl-card-title">Playoff seeds</p>'
    +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
    +'<th>Seed</th><th>Team</th><th>Record</th><th>Notes</th></tr></thead><tbody>';
  top6.forEach(function(row,i){
    var seed=i+1,rec=row.wins+'-'+row.losses+(row.ties?'-'+row.ties:'');
    var bye=seed<=2?'<span class="gl-badge gl-badge-bye">First round bye</span>':'';
    html+='<tr><td style="font-weight:600;font-size:18px">'+(seed<=2?'⭐ ':'')+seed+'</td>'
      +'<td class="gl-pname">'+row.team.name+'</td>'
      +'<td class="gl-muted">'+rec+'</td><td>'+bye+'</td></tr>';
  });
  html+='</tbody></table></div>'
    +'<div class="gl-notice">Seeds 1 &amp; 2 receive a first-round bye. Seeds 3 vs 6 and 4 vs 5 play in Round 1.</div></div>';

  var s=top6.map(function(r){return r.team;});
  function pr(round,match){return S.playoffResults.filter(function(r){return r.round===round&&r.match===match;})[0]||null;}
  var r1a={home:s[2]?s[2].name:'Seed 3',away:s[5]?s[5].name:'Seed 6'};
  var r1b={home:s[3]?s[3].name:'Seed 4',away:s[4]?s[4].name:'Seed 5'};
  var p3v6=pr(1,'3v6'),p4v5=pr(1,'4v5');
  var sf1b=p3v6?(p3v6.winner===0?r1a.home:r1a.away):'Winner (3v6)';
  var sf2b=p4v5?(p4v5.winner===0?r1b.home:r1b.away):'Winner (4v5)';
  var psf1=pr(2,'sf1'),psf2=pr(2,'sf2');
  var finA=psf1?(psf1.winner===0?(s[0]?s[0].name:'Seed 1'):sf1b):'Winner SF1';
  var finB=psf2?(psf2.winner===0?(s[1]?s[1].name:'Seed 2'):sf2b):'Winner SF2';

  function pmatch(round,matchKey,tA,tB){
    var res=pr(round,matchKey);
    var wA=res&&res.winner===0,wB=res&&res.winner===1;
    return '<div class="gl-playoff-match"><div class="gl-playoff-team'+(wA?' winner':!tA?' tbd':'')+'">'+(tA||'TBD')+(wA?' 🏆':'')+'</div>'
      +'<div class="gl-playoff-team'+(wB?' winner':!tB?' tbd':'')+'">'+(tB||'TBD')+(wB?' 🏆':'')+'</div></div>';
  }

  html+='<div class="gl-card"><p class="gl-card-title">Bracket</p>'
    +'<div class="gl-playoff-bracket">'
    +'<div class="gl-playoff-round"><div class="gl-playoff-round-title">Round 1</div>'
    +pmatch(1,'3v6',r1a.home,r1a.away)+pmatch(1,'4v5',r1b.home,r1b.away)+'</div>'
    +'<div class="gl-playoff-round"><div class="gl-playoff-round-title">Semifinals</div>'
    +pmatch(2,'sf1',s[0]?s[0].name:'Seed 1',sf1b)+pmatch(2,'sf2',s[1]?s[1].name:'Seed 2',sf2b)+'</div>'
    +'<div class="gl-playoff-round"><div class="gl-playoff-round-title">Championship</div>'
    +pmatch(3,'final',finA,finB)+'</div></div>';

  html+='<hr class="gl-sep"><p style="font-size:15px;font-weight:500;margin-bottom:16px;color:var(--gl-text-mid)">Record playoff result</p>'
    +'<div class="gl-form-grid">'
    +'<div class="gl-field"><label>Matchup</label><select id="gl-po-round">'
    +'<option value="1-3v6">R1: '+r1a.home+' vs '+r1a.away+'</option>'
    +'<option value="1-4v5">R1: '+r1b.home+' vs '+r1b.away+'</option>'
    +'<option value="2-sf1">SF1: '+(s[0]?s[0].name:'Seed 1')+' vs '+sf1b+'</option>'
    +'<option value="2-sf2">SF2: '+(s[1]?s[1].name:'Seed 2')+' vs '+sf2b+'</option>'
    +'<option value="3-final">Final: '+finA+' vs '+finB+'</option>'
    +'</select></div>'
    +'<div class="gl-field"><label>Winner</label><select id="gl-po-winner"><option value="0">First named team</option><option value="1">Second named team</option></select></div>'
    +'</div><button class="gl-btn" onclick="glSavePlayoffResult()">Save result</button></div>';

  el('gl-playoffs').innerHTML=html;
}
window.glSavePlayoffResult=function(){
  var rsel=el('gl-po-round'),wsel=el('gl-po-winner');if(!rsel||!wsel)return;
  var parts=rsel.value.split('-'),round=parseInt(parts[0]),match=parts.slice(1).join('-'),winner=parseInt(wsel.value);
  S.playoffResults=S.playoffResults.filter(function(r){return!(r.round===round&&r.match===match);});
  S.playoffResults.push({round:round,match:match,winner:winner});
  save();glRenderPlayoffs();
};

// ── Render: Prizes ───────────────────────────────────────────────────────
function getIndivWinnerForWeek(weekDate){
  var rounds=S.rounds.filter(function(r){return r.date===weekDate&&!r.seed;});
  if(!rounds.length) return null;
  var best=null,bestMargin=null;
  rounds.forEach(function(r){
    var q=getQuotaAt(r.playerId,r.date);if(q===null)return;
    var margin=Math.round((r.points-q)*10)/10;
    if(bestMargin===null||margin>bestMargin){bestMargin=margin;best={playerId:r.playerId,points:r.points,quota:q,margin:margin};}
  });
  return best;
}
function buildIndivPrizeLB(){
  var players={};
  S.schedule.forEach(function(week){
    var winner=getIndivWinnerForWeek(week.date);if(!winner)return;
    var pid=winner.playerId;
    if(!players[pid])players[pid]={wins:0,bestMargin:null,bestWeek:null};
    players[pid].wins++;
    if(players[pid].bestMargin===null||winner.margin>players[pid].bestMargin){players[pid].bestMargin=winner.margin;players[pid].bestWeek=week.week;}
  });
  return Object.keys(players).map(function(pid){
    var p=playerById(pid);
    return {player:p,wins:players[pid].wins,bestMargin:players[pid].bestMargin,bestWeek:players[pid].bestWeek};
  }).sort(function(a,b){return b.wins!==a.wins?b.wins-a.wins:b.bestMargin-a.bestMargin;});
}

function glRenderPrizes(){
  var weekOpts=S.schedule.map(function(w){return '<option value="'+w.week+'">Week '+w.week+' — '+w.date+'</option>';}).join('');
  var playerOpts='<option value="">— select player —</option>'+S.players.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('');

  var html='<div class="gl-card"><p class="gl-card-title">Enter closest to the pin</p>'
    +'<div class="gl-form-grid">'
    +'<div class="gl-field"><label>Week</label><select id="gl-ctp-week">'+weekOpts+'</select></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px">'
    +'<div style="background:var(--gl-green-pale);border-radius:var(--gl-radius);padding:16px">'
    +'<div style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--gl-text-mid);margin-bottom:12px">CTP #1</div>'
    +'<div class="gl-form-grid" style="grid-template-columns:1fr">'
    +'<div class="gl-field"><label>Hole #</label><input type="number" id="gl-ctp1-hole" min="1" max="18" placeholder="e.g. 4"></div>'
    +'<div class="gl-field"><label>Player</label><select id="gl-ctp1-player">'+playerOpts+'</select></div>'
    +'<div class="gl-field"><label>Distance</label><input type="text" id="gl-ctp1-dist" placeholder="e.g. 4\'2&quot;"></div>'
    +'</div></div>'
    +'<div style="background:var(--gl-green-pale);border-radius:var(--gl-radius);padding:16px">'
    +'<div style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;color:var(--gl-text-mid);margin-bottom:12px">CTP #2</div>'
    +'<div class="gl-form-grid" style="grid-template-columns:1fr">'
    +'<div class="gl-field"><label>Hole #</label><input type="number" id="gl-ctp2-hole" min="1" max="18" placeholder="e.g. 7"></div>'
    +'<div class="gl-field"><label>Player</label><select id="gl-ctp2-player">'+playerOpts+'</select></div>'
    +'<div class="gl-field"><label>Distance</label><input type="text" id="gl-ctp2-dist" placeholder="e.g. 6\'8&quot;"></div>'
    +'</div></div>'
    +'</div>'
    +'<button class="gl-btn" onclick="glSaveCTP()">Save CTP results</button></div>';

  var ctpRows=S.ctp.slice().sort(function(a,b){return b.week-a.week;});
  if(ctpRows.length){
    html+='<div class="gl-card"><p class="gl-card-title">Closest to the pin results</p>'
      +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
      +'<th>Week</th><th>Date</th><th>Hole</th><th>Winner</th><th>Distance</th><th></th>'
      +'</tr></thead><tbody>';
    ctpRows.forEach(function(c){
      var week=S.schedule.filter(function(w){return w.week===c.week;})[0];
      var date=week?week.date:'';
      var p=playerById(c.playerId);
      html+='<tr><td class="gl-muted">'+c.week+'</td><td class="gl-muted">'+date+'</td>'
        +'<td style="font-weight:500">'+(c.hole?'Hole '+c.hole:'—')+'</td>'
        +'<td class="gl-pname">'+( p?p.name:'(deleted)')+'</td>'
        +'<td>'+(c.distance||'—')+'</td>'
        +'<td><button class="gl-btn-sm" onclick="glDeleteCTP(\''+c.id+'\')">Del</button></td></tr>';
    });
    html+='</tbody></table></div></div>';
  }

  var ctpTally={};
  S.ctp.forEach(function(c){ctpTally[c.playerId]=(ctpTally[c.playerId]||0)+1;});
  var ctpLB=Object.keys(ctpTally).map(function(pid){return{player:playerById(pid),wins:ctpTally[pid]};}).sort(function(a,b){return b.wins-a.wins;});
  if(ctpLB.length){
    html+='<div class="gl-card"><p class="gl-card-title">CTP season leaderboard</p>'
      +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr><th>#</th><th>Player</th><th>CTP wins</th></tr></thead><tbody>';
    ctpLB.forEach(function(row,i){
      var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'<span class="gl-rank-num">'+(i+1)+'</span>';
      html+='<tr><td>'+medal+'</td><td class="gl-pname">'+(row.player?row.player.name:'(deleted)')+'</td><td style="font-weight:600;font-size:18px">'+row.wins+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
  }

  html+='<hr class="gl-sep">';

  html+='<div class="gl-card"><p class="gl-card-title">Weekly individual prize <span style="font-size:15px;font-weight:400;font-family:\'DM Sans\',sans-serif;color:var(--gl-text-light)">— $50 to most points over quota</span></p>'
    +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
    +'<th>Week</th><th>Date</th><th>Winner</th><th>Points</th><th>Quota</th><th>Over quota</th>'
    +'</tr></thead><tbody>';
  var hasAny=false;
  S.schedule.forEach(function(week){
    // prefer live-calculated winner
    var winner=getIndivWinnerForWeek(week.date);
    if(winner){
      hasAny=true;
      var p=playerById(winner.playerId);
      var sign=winner.margin>=0?'+':'';
      html+='<tr><td class="gl-muted">'+week.week+'</td><td class="gl-muted">'+week.date+'</td>'
        +'<td class="gl-pname">🏆 '+(p?p.name:'(deleted)')+'</td>'
        +'<td style="font-weight:600">'+winner.points+'</td>'
        +'<td class="gl-muted">'+winner.quota+'</td>'
        +'<td><span class="gl-badge gl-badge-up">'+sign+winner.margin+'</span></td></tr>';
    } else {
      // fall back to seeded prize winners
      var seed=(S.seedIndivPrize||[]).filter(function(s){return s.week===week.week;})[0];
      if(seed){
        hasAny=true;
        var p=playerById(seed.playerId);
        var sign=seed.margin>=0?'+':'';
        html+='<tr><td class="gl-muted">'+week.week+'</td><td class="gl-muted">'+week.date+'</td>'
          +'<td class="gl-pname">🏆 '+(p?p.name:'(deleted)')+'</td>'
          +'<td style="font-weight:600">'+(seed.points!==null?seed.points:'—')+'</td>'
          +'<td class="gl-muted">'+(seed.quota!==null?seed.quota:'—')+'</td>'
          +'<td>'+(seed.margin!==null?'<span class="gl-badge gl-badge-up">'+sign+seed.margin+'</span>':'—')+'</td></tr>';
      }
    }
  });
  if(!hasAny) html+='<tr><td colspan="6" style="text-align:center;color:var(--gl-text-light);padding:24px;font-size:15px">Winners appear automatically once scores are entered.</td></tr>';
  html+='</tbody></table></div></div>';

  var indivLB=buildIndivPrizeLB();
  if(indivLB.length){
    html+='<div class="gl-card"><p class="gl-card-title">Individual prize season leaderboard</p>'
      +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
      +'<th>#</th><th>Player</th><th>Team</th><th>Wins</th><th>Best margin</th><th>Best week</th>'
      +'</tr></thead><tbody>';
    indivLB.forEach(function(row,i){
      var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'<span class="gl-rank-num">'+(i+1)+'</span>';
      var team=row.player&&row.player.teamId?teamName(row.player.teamId):'<span class="gl-muted">Sub pool</span>';
      var sign=row.bestMargin>=0?'+':'';
      html+='<tr><td>'+medal+'</td><td class="gl-pname">'+(row.player?row.player.name:'(deleted)')+'</td>'
        +'<td class="gl-muted">'+team+'</td><td style="font-weight:600;font-size:18px">'+row.wins+'</td>'
        +'<td><span class="gl-badge gl-badge-up">'+sign+row.bestMargin+'</span></td>'
        +'<td class="gl-muted">Wk '+row.bestWeek+'</td></tr>';
    });
    html+='</tbody></table></div>'
      +'<div class="gl-notice">Winners calculated automatically from entered scores — highest points above personal quota each week.</div></div>';
  }
  el('gl-prizes').innerHTML=html;
}
window.glSaveCTP=function(){
  var week=parseInt((el('gl-ctp-week')||{value:''}).value);
  if(!week){alert('Please select a week.');return;}
  var entries=[
    {pEl:'gl-ctp1-player',dEl:'gl-ctp1-dist',hEl:'gl-ctp1-hole'},
    {pEl:'gl-ctp2-player',dEl:'gl-ctp2-dist',hEl:'gl-ctp2-hole'}
  ];
  var saved=0;
  entries.forEach(function(e,idx){
    var pid=(el(e.pEl)||{value:''}).value;
    var dist=(el(e.dEl)||{value:''}).value.trim();
    var hole=parseInt((el(e.hEl)||{value:''}).value)||0;
    if(!pid) return;
    // Remove existing entry for this week+slot (by slot index, not player)
    var slotKey='w'+week+'-ctp'+(idx+1);
    S.ctp=S.ctp.filter(function(c){return c.slotKey!==slotKey;});
    S.ctp.push({id:uid(),week:week,hole:hole,playerId:pid,distance:dist,slotKey:slotKey});
    saved++;
  });
  if(!saved){alert('Please select at least one player.');return;}
  save();alert('CTP results saved!');glRenderPrizes();
};
window.glDeleteCTP=function(id){
  S.ctp=S.ctp.filter(function(c){return c.id!==id;});
  save();glRenderPrizes();
};

// ── Render: History ──────────────────────────────────────────────────────
function glRenderHistory(){
  var sorted=S.rounds.filter(function(r){return !r.seed;})
    .sort(function(a,b){return b.date>a.date?1:b.date<a.date?-1:0;});
  if(!sorted.length){
    el('gl-history').innerHTML='<div class="gl-empty"><p>No scores entered yet.</p></div>';
    return;
  }
  var html='<div class="gl-card"><p class="gl-card-title">Score history <span style="font-size:15px;font-weight:400;font-family:\'DM Sans\',sans-serif;color:var(--gl-text-light)">— delete an entry to correct it, then re-enter</span></p>'
    +'<div class="gl-table-wrap"><table class="gl-table"><thead><tr>'
    +'<th>Date</th><th>Player</th><th>Team</th><th>Points</th><th>Quota</th><th>Net</th><th>Sub?</th><th></th>'
    +'</tr></thead><tbody>';
  sorted.forEach(function(r){
    var p=playerById(r.playerId);
    var q=getQuotaAt(r.playerId,r.date);
    var net=q!==null?Math.round((r.points-q)*10)/10:null;
    var netD='<span class="gl-muted">—</span>';
    if(net!==null){
      var s=net>=0?'+':'',cls=net>0?'gl-badge-up':net<0?'gl-badge-down':'gl-badge-even';
      netD='<span class="gl-badge '+cls+'">'+s+net+'</span>';
    }
    html+='<tr>'
      +'<td class="gl-muted">'+r.date+'</td>'
      +'<td class="gl-pname">'+(p?p.name:'(deleted)')+'</td>'
      +'<td class="gl-muted">'+(r.teamId?teamName(r.teamId):'—')+'</td>'
      +'<td style="font-weight:600">'+r.points+'</td>'
      +'<td class="gl-muted">'+(q!==null?q:'—')+'</td>'
      +'<td>'+netD+'</td>'
      +'<td>'+(r.isSub?'<span class="gl-badge gl-badge-sub">sub</span>':'')+'</td>'
      +'<td><button class="gl-btn-sm" onclick="glDeleteHistoryRound(\''+r.id+'\')">Delete</button></td>'
      +'</tr>';
  });
  html+='</tbody></table></div></div>';
  el('gl-history').innerHTML=html;
}
window.glDeleteHistoryRound=function(id){
  if(!confirm('Delete this round? You can re-enter it with the correct details afterwards.'))return;
  S.rounds=S.rounds.filter(function(r){return r.id!==id;});
  save();glRenderHistory();
};

// ── Tab switching ────────────────────────────────────────────────────────
var GL_TABS=['standings','schedule','enter','roster','playoffs','prizes','history'];
window.glShowTab=function(name){
  GL_TABS.forEach(function(t){el('gl-'+t).style.display=t===name?'':'none';});
  document.querySelectorAll('.gl-tab').forEach(function(btn,i){btn.classList.toggle('gl-tab-active',GL_TABS[i]===name);});
  glRender(name);
};
function glRender(tab){
  tab=tab||'standings';
  if(tab==='standings')glRenderStandings();
  else if(tab==='schedule')glRenderSchedule();
  else if(tab==='enter')glRenderEnter();
  else if(tab==='roster')glRenderRoster();
  else if(tab==='playoffs')glRenderPlayoffs();
  else if(tab==='prizes')glRenderPrizes();
  else if(tab==='history')glRenderHistory();
}

load();
glRender('standings');
})();
</script>
